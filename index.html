    <style>
      /* first paint before CSS loads: warm canvas, never a black flash */
      html, body { background: #FBF6EE; margin: 0; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(1200px 600px at 70% 10%, #FFE2B8 0%, #FBF6EE 55%); }
      #boot .ring { width: 64px; height: 64px; border-radius: 50%;
        background: repeating-radial-gradient(circle at 50% 50%, #C9762A 0 3px, #E9B57A 3px 6px);
        box-shadow: 0 10px 30px -10px #A95E1F; animation: boot 1.2s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: scale(.9) rotate(0) } to { transform: scale(1) rotate(25deg) } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div class="ring"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
