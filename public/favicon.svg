<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Maruthi Timber Depot — Hanuman's gada on teak end grain</title>
  <defs>
    <radialGradient id="saffron" cx="50%" cy="38%" r="62%">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset=".55" stop-color="#F07A1A"/>
      <stop offset="1" stop-color="#B83A0B"/>
    </radialGradient>
    <radialGradient id="wood" cx="48%" cy="46%" r="62%">
      <stop offset="0" stop-color="#FBE3BA"/>
      <stop offset=".6" stop-color="#E7B06A"/>
      <stop offset="1" stop-color="#B9762F"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF4C4"/>
      <stop offset=".45" stop-color="#F6C744"/>
      <stop offset="1" stop-color="#B7791F"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" x2="1">
      <stop offset="0" stop-color="#C98A1E"/>
      <stop offset=".45" stop-color="#FFE38A"/>
      <stop offset="1" stop-color="#B7791F"/>
    </linearGradient>
  </defs>
  <!-- saffron (sindoor) medallion -->
  <circle cx="32" cy="32" r="31" fill="url(#saffron)"/>
  <circle cx="32" cy="32" r="30.2" fill="none" stroke="#FFD27A" stroke-opacity=".7" stroke-width=".8"/>
  <!-- teak log end -->
  <circle cx="32" cy="32" r="25.2" fill="url(#wood)" stroke="#7C3A10" stroke-opacity=".55" stroke-width="1"/>
  <g fill="none" stroke="#A8652A" stroke-opacity=".42" stroke-width=".9">
    <ellipse cx="31.6" cy="32.4" rx="21" ry="20.4"/>
    <ellipse cx="31.8" cy="32.2" rx="16.6" ry="16"/>
    <ellipse cx="31.6" cy="32.6" rx="12.2" ry="11.8"/>
    <ellipse cx="31.9" cy="32.3" rx="7.8" ry="7.4"/>
  </g>
  <!-- gada: Hanuman's mace -->
  <g stroke="#6B3300" stroke-width=".85" stroke-linejoin="round">
    <rect x="30.35" y="33.6" width="3.3" height="19.4" rx="1.65" fill="url(#goldv)"/>
    <g fill="none" stroke-width=".7" stroke-opacity=".75"><path d="M30.6 41.5h2.8M30.6 44.3h2.8M30.6 47.1h2.8"/></g>
    <circle cx="32" cy="54.6" r="2.3" fill="url(#gold)"/>
    <rect x="27.4" y="31.2" width="9.2" height="3.3" rx="1.3" fill="url(#gold)"/>
    <ellipse cx="32" cy="21.6" rx="9.6" ry="9.9" fill="url(#gold)"/>
    <g fill="none" stroke-width=".7" stroke-opacity=".8">
      <ellipse cx="32" cy="21.6" rx="3.3" ry="9.7"/>
      <ellipse cx="32" cy="21.6" rx="6.6" ry="9.8"/>
      <path d="M22.6 21.6h18.8"/>
    </g>
    <path d="M32 7.6l1.5 3.4h-3z" fill="url(#gold)"/>
    <circle cx="32" cy="11.6" r="1.7" fill="url(#gold)"/>
  </g>
  <ellipse cx="28.6" cy="17.8" rx="2.5" ry="3.6" fill="#FFFFFF" fill-opacity=".5"/>
</svg>
